<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOADIN Login</title><style>:root{font-family:Inter,system-ui,Arial;background:#f5f8fb;color:#10243d}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:32px 18px}.brand{font-size:34px;font-weight:900;margin-bottom:8px}.brand b{color:#ff7a00}.card{background:#fff;border:1px solid #e6edf4;border-radius:24px;padding:24px;box-shadow:0 16px 45px #10243d12}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.role{border:1px solid #dce5ed;background:#fff;padding:11px;border-radius:12px;font-weight:800;cursor:pointer}.role.active{background:#102a46;color:#fff;border-color:#102a46}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:800}.field input{padding:13px;border:1px solid #cfd9e2;border-radius:12px;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:13px;padding:13px;font-weight:900;cursor:pointer;background:#102a46;color:#fff}.btn.primary{background:#ff7a00}.btn:disabled{opacity:.5}.note{color:#637386;line-height:1.55;font-size:14px}.status{margin-top:14px;padding:12px;border-radius:12px;background:#eef5ff;color:#244e77}.status.ok{background:#eaf9ef;color:#1e7b46}.status.err{background:#fff0f0;color:#a32626}.demo{background:#fff7e9;border:1px solid #ffd8a8;border-radius:14px;padding:12px;color:#80510a;margin:14px 0}@media(max-width:650px){.roles{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand">LOAD<b>IN</b></div><section class="card"><h1>Secure sign in</h1><p class="note">Production uses Supabase phone authentication and the SMS provider configured in the LOADIN project. No OTP is faked in live mode.</p><div class="roles"><button class="role active" data-role="CUSTOMER">Customer</button><button class="role" data-role="PARTNER">Partner</button><button class="role" data-role="ADMIN">Admin</button><button class="role" data-role="FLEET">Fleet</button></div><div id="demoBox"></div><div class="field"><label for="phone">Mobile number</label><input id="phone" inputmode="tel" autocomplete="tel" value="+91" placeholder="+91 98765 43210"></div><div class="field"><label for="otp">6-digit OTP</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Enter OTP"></div><div class="actions"><button id="send" class="btn">Send OTP</button><button id="verify" class="btn primary">Verify & Continue</button></div><div id="status"></div></section></main><script type="module" src="./app.js"></script></body></html>
