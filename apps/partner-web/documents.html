<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOADIN Partner Documents</title><style>:root{font-family:Inter,system-ui,Arial;background:#f5f7fa;color:#10243d}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:900}.brand i{color:#ff7a00;font-style:normal}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{background:#fff;border:1px solid #e5ebf1;border-radius:20px;padding:18px;box-shadow:0 10px 25px #10243d0d}.doc{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed #e7edf3}.doc:last-child{border:0}.doc small{display:block;color:#6b7785;margin-top:4px}.upload{padding:9px 12px;border-radius:12px;border:1px solid #ccd7e1;background:#fff;font-weight:800;cursor:pointer}.ok{color:#18824b}.warn{color:#b05700}.progress{height:10px;background:#edf1f5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:#ff7a00}.foot{margin-top:18px;background:#10243d;color:#fff;border-radius:20px;padding:18px}.foot button{background:#ff7a00;color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:900}.status{font-size:13px;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column;gap:8px}.wrap{padding:14px}}</style></head><body><main class="wrap"><div class="head"><div><div class="brand">LOAD<i>IN</i> Partner</div><h1>Documents & Verification</h1></div><a href="/partner-onboarding">← Onboarding</a></div><div class="card"><div style="display:flex;justify-content:space-between"><strong id="count">0 / 11 ready</strong><span class="status">PDF/JPG/PNG/WEBP • max 10MB</span></div><div class="progress" style="margin-top:10px"><i id="bar" style="width:0%"></i></div></div><section class="grid" id="grid"></section><section class="foot"><h2>Verification flow</h2><p>Staff review → Admin approval → Active Offline. Document expiry can auto-block Go Online until a valid replacement is approved.</p><button id="review">Send for Final Review</button><span id="message" style="margin-left:10px"></span></section></main><script type="module">import {validateDocumentUpload} from '../../src/platform/runtime-integrations.js';import {experienceStore} from '../shared/experience-store.js';const groups=[{title:'Personal Documents',step:'PERSONAL_DOCS',items:['Aadhaar / ID','Driving Licence','PAN','Address Proof','Police / Background Proof']},{title:'Vehicle Documents',step:'VEHICLE_DOCS',items:['RC','Insurance','PUC','Permit','Fitness Certificate']},{title:'Bank Proof',step:'BANK',items:['Cancelled Cheque / Passbook']}];const state=new Map();function draw(){grid.innerHTML=groups.map((g,gi)=>`<article class="card"><h2>${g.title}</h2>${g.items.map((x,i)=>{const k=`${gi}-${i}`,v=state.get(k);return `<div class="doc"><div><strong>${x}</strong><small>${v?`${v.name} • ${v.status}`:'Not uploaded'}</small></div><label class="upload">${v?'Replace':'Upload'}<input hidden type="file" data-key="${k}" data-step="${g.step}" accept=".pdf,.jpg,.jpeg,.png,.webp"></label></div>`}).join('')}</article>`).join('');document.querySelectorAll('input[type=file]').forEach(input=>input.onchange=()=>{const f=input.files?.[0];if(!f)return;const check=validateDocumentUpload(f);state.set(input.dataset.key,{name:f.name,status:check.ok?'Ready for review':check.errors.join(', '),ok:check.ok,step:input.dataset.step});if(check.ok){const stepItems=[...state.values()].filter(v=>v.step===input.dataset.step);const required=groups.find(g=>g.step===input.dataset.step).items.length;if(stepItems.filter(v=>v.ok).length===required)experienceStore.completeStep(input.dataset.step)}draw()});const ready=[...state.values()].filter(v=>v.ok).length;count.textContent=`${ready} / 11 ready`;bar.style.width=`${Math.round(ready/11*100)}%`}review.onclick=()=>{const ready=[...state.values()].filter(v=>v.ok).length;message.textContent=ready===11?'Submitted for staff + Admin review.':'Upload all required valid documents first.'};draw();</script></body></html>
