<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOADIN Partner Documents</title><style>:root{font-family:Inter,system-ui,Arial;background:#f5f7fa;color:#10243d}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:900}.brand i{color:#ff7a00;font-style:normal}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{background:#fff;border:1px solid #e5ebf1;border-radius:20px;padding:18px;box-shadow:0 10px 25px #10243d0d}.doc{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px dashed #e7edf3}.doc:last-child{border:0}.doc small{display:block;color:#6b7785;margin-top:4px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.meta input{border:1px solid #d6e0e8;border-radius:9px;padding:7px 9px;min-width:135px}.upload{padding:9px 12px;border-radius:12px;border:1px solid #ccd7e1;background:#fff;font-weight:800;cursor:pointer}.upload.busy{opacity:.55;pointer-events:none}.ok{color:#18824b}.warn{color:#b05700}.progress{height:10px;background:#edf1f5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:#ff7a00}.foot{margin-top:18px;background:#10243d;color:#fff;border-radius:20px;padding:18px}.foot button{background:#ff7a00;color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:900}.status{font-size:13px;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column;gap:8px}.wrap{padding:14px}.doc{grid-template-columns:1fr}.upload{display:inline-block}}</style></head><body><main class="wrap"><div class="head"><div><div class="brand">LOAD<i>IN</i> Partner</div><h1>Documents & Verification</h1></div><a href="/partner-onboarding">← Onboarding</a></div><div class="card"><div style="display:flex;justify-content:space-between"><strong id="count">0 / 11 ready</strong><span class="status">PDF/JPG/PNG/WEBP • max 10MB</span></div><div class="progress" style="margin-top:10px"><i id="bar" style="width:0%"></i></div><p id="modeLine" style="margin-bottom:0;color:#6b7785"></p></div><section class="grid" id="grid"></section><section class="foot"><h2>Verification flow</h2><p>Staff review → Admin approval → Active Offline. Expired mandatory documents automatically block Go Online until a renewed document is approved.</p><button id="review">Send for Final Review</button><span id="message" style="margin-left:10px"></span></section></main><script type="module">import {validateDocumentUpload} from '../../src/platform/runtime-integrations.js';import {experienceStore} from '../shared/experience-store.js';import {loadinData} from '../shared/loadin-data.js';const groups=[{title:'Personal Documents',step:'PERSONAL_DOCS',items:[{label:'Aadhaar / ID',type:'AADHAAR_ID',scope:'PARTNER'},{label:'Driving Licence',type:'DRIVING_LICENCE',scope:'PARTNER',expiry:true},{label:'PAN',type:'PAN',scope:'PARTNER'},{label:'Address Proof',type:'ADDRESS_PROOF',scope:'PARTNER'},{label:'Police / Background Proof',type:'POLICE_BACKGROUND',scope:'PARTNER',expiry:true}]},{title:'Vehicle Documents',step:'VEHICLE_DOCS',items:[{label:'RC',type:'RC',scope:'VEHICLE'},{label:'Insurance',type:'INSURANCE',scope:'VEHICLE',expiry:true},{label:'PUC',type:'PUC',scope:'VEHICLE',expiry:true},{label:'Permit',type:'PERMIT',scope:'VEHICLE',expiry:true},{label:'Fitness Certificate',type:'FITNESS_CERTIFICATE',scope:'VEHICLE',expiry:true}]},{title:'Bank Proof',step:'BANK',items:[{label:'Cancelled Cheque / Passbook',type:'BANK_PROOF',scope:'PARTNER'}]}];const state=new Map();modeLine.textContent=loadinData.mode==='LIVE'?'LIVE: files upload to private partner-documents storage; expiry dates are enforced before Go Online.':'DEMO: no OTP/storage subscription required.';function markStep(step){const group=groups.find(g=>g.step===step);const rows=[...state.values()].filter(v=>v.step===step);if(rows.filter(v=>v.ok).length===group.items.length)experienceStore.completeStep(step)}function draw(){grid.innerHTML=groups.map((g,gi)=>`<article class="card"><h2>${g.title}</h2>${g.items.map((x,i)=>{const k=`${gi}-${i}`,v=state.get(k);return `<div class="doc"><div><strong>${x.label}</strong><small class="${v?.ok?'ok':v?.error?'warn':''}">${v?`${v.name} • ${v.status}`:'Not uploaded'}</small><div class="meta"><input data-number-for="${k}" placeholder="Document number (optional)" value="${v?.documentNumber||''}">${x.expiry?`<input data-expiry-for="${k}" type="date" aria-label="${x.label} expiry date" value="${v?.expiryDate||''}">`:''}</div></div><label class="upload ${v?.busy?'busy':''}">${v?.busy?'Uploading…':v?'Replace':'Upload'}<input hidden type="file" data-key="${k}" data-step="${g.step}" data-scope="${x.scope}" data-type="${x.type}" data-expiry="${x.expiry?'yes':'no'}" accept=".pdf,.jpg,.jpeg,.png,.webp"></label></div>`}).join('')}</article>`).join('');document.querySelectorAll('[data-number-for]').forEach(i=>i.oninput=()=>{const old=state.get(i.dataset.numberFor)||{};state.set(i.dataset.numberFor,{...old,documentNumber:i.value})});document.querySelectorAll('[data-expiry-for]').forEach(i=>i.oninput=()=>{const old=state.get(i.dataset.expiryFor)||{};state.set(i.dataset.expiryFor,{...old,expiryDate:i.value})});document.querySelectorAll('input[type=file]').forEach(input=>input.onchange=async()=>{const f=input.files?.[0];if(!f)return;const check=validateDocumentUpload(f),old=state.get(input.dataset.key)||{};const expiry=document.querySelector(`[data-expiry-for="${input.dataset.key}"]`)?.value||old.expiryDate||null;const number=document.querySelector(`[data-number-for="${input.dataset.key}"]`)?.value||old.documentNumber||null;if(input.dataset.expiry==='yes'&&!expiry){state.set(input.dataset.key,{...old,name:f.name,status:'Expiry date required',ok:false,error:true,step:input.dataset.step,documentNumber:number});draw();return}if(expiry&&new Date(`${expiry}T00:00:00`).getTime()<Date.now()-86400000){state.set(input.dataset.key,{...old,name:f.name,status:'Document already expired',ok:false,error:true,step:input.dataset.step,documentNumber:number,expiryDate:expiry});draw();return}if(!check.ok){state.set(input.dataset.key,{...old,name:f.name,status:check.errors.join(', '),ok:false,error:true,step:input.dataset.step,documentNumber:number,expiryDate:expiry});draw();return}state.set(input.dataset.key,{...old,name:f.name,status:'Uploading securely…',ok:false,busy:true,step:input.dataset.step,documentNumber:number,expiryDate:expiry});draw();try{const saved=await loadinData.uploadPartnerDocument({file:f,scope:input.dataset.scope,documentType:input.dataset.type,documentNumber:number,expiryDate:expiry});state.set(input.dataset.key,{name:f.name,status:saved.demo?'Demo ready for review':`${saved.status||'PENDING'} review`,ok:true,step:input.dataset.step,documentNumber:number,expiryDate:expiry});markStep(input.dataset.step)}catch(e){state.set(input.dataset.key,{name:f.name,status:e.message,ok:false,error:true,step:input.dataset.step,documentNumber:number,expiryDate:expiry})}draw()});const ready=[...state.values()].filter(v=>v.ok).length;count.textContent=`${ready} / 11 ready`;bar.style.width=`${Math.round(ready/11*100)}%`}review.onclick=()=>{const ready=[...state.values()].filter(v=>v.ok).length;message.textContent=ready===11?'Documents ready. Staff + Admin review submission is next.':'Upload all required valid documents first.'};draw();</script></body></html>
