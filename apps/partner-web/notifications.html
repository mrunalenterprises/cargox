round:#eaf9ef;color:#1e7b46}.status.error{background:#fff0f0;color:#a32626}.empty{padding:22px;text-align:center;color:#718195}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body data-role="PARTNER"><main class="wrap"><div class="top"><div class="brand">LOAD<i>IN</i> Partner Notifications</div><a id="backLink" class="back" href="/partner">← Partner App</a></div><div class="grid"><section class="card"><div class="head"><div><small>PARTNER ALERTS</small><h1 style="margin:4px 0">Jobs, trips & payouts</h1></div><span class="badge"><span id="unreadCount">0</span> unread</span></div><button id="markAll" class="openBtn" type="button">Mark all read</button><div id="notificationList"></div></section><aside class="card prefs"><h2>Preferences</h2><label>Booking alerts <input id="booking_alerts" type="checkbox"></label><label>Scheduled reminders <input id="scheduled_reminders" type="checkbox"></label><label>Document expiry <input id="document_expiry" type="checkbox"></label><label>High demand <input id="high_demand" type="checkbox"></label><label>Return Load <input id="return_load" type="checkbox"></label><label>Support updates <input id="support_updates" type="checkbox"></label><label>Quiet hours <input id="quiet_hours_enabled" type="checkbox"></label><div class="timeRow"><input id="quiet_hours_start" type="time" value="22:00"><input id="quiet_hours_end" type="time" value="07:00"></div><button id="savePrefs" class="primary" type="button">Save Preferences</button><div id="status" class="status">Loading…</div></aside></div></main><script type="module" src="../shared/live-auth-guard.js"></script><script type="module" src="../shared/notification-center-page.js"></script></body></html>
