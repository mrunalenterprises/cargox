<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOADIN Admin Document Renewals</title><style>body{font-family:Inter,system-ui,Arial;background:#f6f8fb;color:#10233d;margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.brand{font-size:29px;font-weight:900}.brand span{color:#ff7a00}.link{color:#173b62;text-decoration:none;font-weight:800}.grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px;margin-top:18px}.card{background:#fff;border:1px solid #e7edf3;border-radius:20px;padding:18px;box-shadow:0 9px 25px #10233d0d}.queue{display:grid;gap:8px}.qrow{width:100%;text-align:left;border:1px solid #e6ebf1;background:#fff;border-radius:14px;padding:13px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}.qrow.active{border-color:#ff7a00;background:#fff7ef}.qrow small{display:block;color:#6b7b8f;margin-top:4px}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:#fff1e5;color:#b65c0b;font-size:12px;font-weight:900}.red{background:#fff0ee;color:#b52d20}.green{background:#eaf8ef;color:#16834a}.blue{background:#eaf3ff;color:#24649a}.row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #eef2f6}.muted{color:#6a7a8d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:850;cursor:pointer}.primary{background:#ff7a00;color:#fff}.danger{background:#fff0ee;color:#b52d20}.ghost{background:#102a46;color:#fff}.note{width:100%;min-height:80px;border:1px solid #d7e0e8;border-radius:12px;padding:10px;margin-top:12px}.message{margin-top:12px;font-weight:800}.empty{padding:24px;text-align:center;color:#6a7a8d}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:14px}}</style></head><body><main class="wrap"><h
