<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOADIN Admin Support SLA Center</title><style>body{margin:0;font-family:Inter,Arial;background:#f5f7fa;color:#10233d}.wrap{max-width:1120px;margin:auto;padding:24px}.hero{background:#0f2742;color:white;border-radius:24px;padding:24px}.brand{font-size:28px;font-weight:900}.brand span{color:#ff7a00}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.card{background:#fff;border:1px solid #e4eaf0;border-radius:18px;padding:18px}.metric{font-size:32px;font-weight:900}.muted{color:#68798d}.row{display:grid;grid-template-columns:1fr 1.5fr .7fr .7fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eef2f5}.pill{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#eaf5ff;color:#1769aa}.p0{background:#ffe6e6;color:#a51f1f}.p1{background:#fff0db;color:#a35b00}.bad{color:#b31e1e;font-weight:800}.good{color:#18754a;font-weight:800}button{border:0;background:#ff7a00;color:white;border-radius:10px;padding:9px 12px;font-weight:800}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div class="brand">LOAD<span>IN</span> Admin</div><h1>Support SLA & Escalation Center</h1><p>One trip → one support case → one owner. P0 safety and P1 active-trip issues always rise to the top.</p></section><section class="grid"><article class="card"><span class="pill p0">P0</span><div class="metric">1</div><p class="muted">5 min SLA</p></article><article class="card"><span class="pill p1">P1</span><div class="metric">2</div><p class="muted">15 min SLA</p></article><article class="card"><span class="pill">P2</span><div class="metric">4</div><p class="muted">120 min SLA</p></article><article class="card"><span class="pill">P3</span><div class="metric">9</div><p class="muted">480 min SLA</p></article></section><section class="card" style="margin-top:14px"><h2>Priority queue</h2><div id="queue"></div></section></main><script type="module">import{supportSla}from'../shared/growth-ops.js';const now='2026-10-12T16:45:00Z';const cases=[['SUP-901','SOS / Safety','P0','2026-10-12T16:36:00Z'],['SUP-902','Breakdown replacement','P1','2026-10-12T16:24:00Z'],['SUP-903','Active trip dispute','P1','2026-10-12T16:38:00Z'],['SUP-904','Payment clarification','P2','2026-10-12T15:50:00Z']];queue.innerHTML=cases.map(([id,cat,p,opened])=>{const s=supportSla({priority:p,openedAt:opened,now});return `<div class="row"><div><b>${id}</b><div class="muted">${cat}</div></div><span class="pill ${p==='P0'?'p0':p==='P1'?'p1':''}">${p}</span><span>${s.minutesOpen} min</span><span class="${s.breached?'bad':'good'}">${s.breached?'SLA BREACHED':'Within SLA'}</span><button onclick="alert('Escalated to ${s.escalateTo}')">${s.escalateTo}</button></div>`}).join('');</script></body></html>
