<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOADIN Admin Review Center</title><style>body{font-family:Inter,Arial,sans-serif;background:#f7f9fc;color:#10233d;margin:0}.wrap{max-width:1120px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.brand{font-size:30px;font-weight:900}.brand span{color:#ff7a00}.grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:16px;margin-top:18px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 24px #10233d12}.qrow{width:100%;border:0;background:#f8fafc;border-radius:14px;padding:13px;text-align:left;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px;cursor:pointer}.qrow.active{outline:2px solid #ff7a00;background:#fff7ef}.qrow small{display:block;color:#697a8d;margin-top:4px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;margin:14px 0}.checks div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eef2f6}.ok{color:#16834a}.warn{color:#b96900}.badge{padding:5px 9px;border-radius:999px;background:#eef3f8;color:#385168;font-size:12px;font-weight:800}.badge.amber{background:#fff4df;color:#9a5b00}.badge.blue{background:#eaf5ff;color:#1769aa}.badge.green{background:#e9f8ef;color:#16834a}.badge.red{background:#fff0ee;color:#b52d20}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button,.top button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.actions button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#ff7a00;color:#fff}.danger{background:#fff0ee;color:#b52d20}.top button{background:#10233d;color:#fff}.muted{color:#697a8d}.headrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.note{display:grid;gap:6px}.note span{font-size:12px;font-weight:800;color:#697a8d}.note textarea{min-height:85px;border:1px solid #dae3ec;border-radius:12px;padding:10px;resize:vertical}.error{color:#a52b21;background:#fff3f2;padding:10px;border-radius:12px}.toast{position:fixed;right:18px;bottom:18px;background:#10233d;color:#fff;padding:12px 16px;border-radius:13px;box-shadow:0 10px 30px #0003}@media(max-width:760px){.grid{grid-template-columns:1fr}.top,.headrow{align-items:flex-start;flex-direction:column}.checks{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">LOAD<span>IN</span> Admin</div><h1>Partner Review Center</h1><p id="scope" class="muted"></p></div><button id="refresh">Refresh Review Queue</button></div><section class="grid"><article class="card"><h2>Review Queue</h2><p class="muted">Staff Review → Admin Review → Active Offline</p><div id="queue"></div></article><article class="card" id="detail"><h2>Select partner</h2></article></section></main><script type="module" src="./review-center.js"></script></body></html>
