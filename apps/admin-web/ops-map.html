er-radius:11px;box-shadow:0 6px 18px #102a4620;font-size:12px;font-weight:800;z-index:2}@media(max-width:850px){.grid{grid-template-columns:1fr}.map{height:360px}.kpis{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">LOAD<b>IN</b> ADMIN</div><a href="/admin">Back to Admin</a></header><main class="wrap"><section class="kpis"><div class="card kpi"><small>Active Trips</small><strong id="active">0</strong></div><div class="card kpi"><small>Partners Online</small><strong id="online">0</strong></div><div class="card kpi"><small>P0/P1 Alerts</small><strong id="alerts">0</strong></div></section><section class="grid"><div class="card"><span class="pill">LIVE OPERATIONS</span><h1>Trip Map</h1><div class="legend"><span><i class="dot" style="background:#ff7a00"></i>Trip GPS</span><span><i class="dot" style="background:#1781d6"></i>Online Partner</span><span>15-sec refresh</span></div><div id="opsMap" class="map"><div class="road"></div><div class="road2"></div><i class="pin customer"></i><i class="pin partner"></i><i class="pin drop"></i><div id="mapState" class="map-state">Loading live operations…</div></div></div><div class="card"><h2>Priority Queue</h2><div id="queue"></div></div></section></main><script type="module" src="./ops-map.js"></script></body></html>
