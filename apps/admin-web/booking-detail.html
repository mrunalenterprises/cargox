<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOADIN Admin Booking Detail</title><style>:root{font-family:Inter,system-ui,Arial;background:#f5f7fa;color:#10243d}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:900}.brand i{color:#ff7a00;font-style:normal}.kpis,.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr);margin:18px 0}.grid{grid-template-columns:1.2fr .8fr}.card{background:#fff;border:1px solid #e5ebf1;border-radius:20px;padding:18px;box-shadow:0 10px 25px #10243d0d}.kpi strong{display:block;font-size:24px;margin-top:6px}.muted{color:#68788b}.line{padding:10px 0;border-bottom:1px dashed #e5ebf1}.line:last-child{border:0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef3f7;font-weight:800;font-size:12px}.orange{background:#fff0e1;color:#c65a00}.green{background:#e9f8ef;color:#187847}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #ced9e3;background:#fff;border-radius:12px;padding:9px 12px;font-weight:800}.btn.primary{background:#ff7a00;color:#fff;border-color:#ff7a00}@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column;gap:8px}}@media(max-width:520px){.kpis{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">LOAD<i>IN</i> Admin</div><h1>Booking Detail</h1></div><a href="/admin">← Admin Dashboard</a></div><div id="root"></div></main><script type="module">import {demoStore} from '../shared/demo-store.js';import {bookingOpsSummary,directionsLink} from '../../src/platform/runtime-integrations.js';const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);function render(){const s=demoStore.read();const id=new URLSearchParams(location.search).get('id');const b=s.bookings.find(x=>x.id===id)||s.bookings[0];if(!b){root.innerHTML='<div class="card">No booking found.</div>';return}const proofs=s.proofs.filter(x=>x.booking_id===b.id),cases=s.supportCases.filter(x=>x.booking_id===b.id),events=s.events.filter(x=>x.booking_id===b.id),ops=bookingOpsSummary({booking:b,proofs,supportCases:cases,events});root.innerHTML=`<div class="kpis"><div class="card kpi"><span class="muted">Status</span><strong>${ops.status}</strong></div><div class="card kpi"><span class="muted">Fare Locked</span><strong>${money(ops.fare)}</strong></div><div class="card kpi"><span class="muted">Proofs</span><strong>${ops.proofCount}</strong></div><div class="card kpi"><span class="muted">Open Support</span><strong>${ops.openSupport}</strong></div></div><div class="grid"><section class="card"><h2>${b.id}</h2><div class="line"><span class="pill orange">${b.service_code}</span> <span class="pill ${ops.partnerAssigned?'green':''}">${ops.partnerAssigned?'PARTNER ASSIGNED':'UNASSIGNED'}</span></div><div class="line"><strong>Pickup</strong><div class="muted">${b.pickup_address}</div></div><div class="line"><strong>Drop</strong><div class="muted">${b.drop_address}</div></div><div class="line"><strong>Goods</strong><div class="muted">${b.goods_description||'—'} • ${b.vehicle_class||'—'}</div></div><div class="line"><strong>Payment</strong><div class="muted">${b.customer_payment_mode} • Fare Lock ${b.fare_locked?'ON':'OFF'}</div></div><div class="actions" style="margin-top:14px"><a class="btn primary" target="_blank" href="${directionsLink({pickup:b.pickup_address,drop:b.drop_address})}">Open Route</a><a class="btn" href="/admin-map">Live Ops Map</a></div></section><aside class="card"><h2>Settlement</h2><div class="line"><span>LOADIN commission</span><strong style="float:right">${money(ops.commission)}</strong></div><div class="line"><span>Partner entitlement</span><strong style="float:right">${money(ops.partnerEntitlement)}</strong></div><h2>Proof & Support</h2>${proofs.map(p=>`<div class="line"><strong>${p.type}</strong><div class="muted">${p.note||''}</div></div>`).join('')||'<div class="muted">No proof yet.</div>'}${cases.map(c=>`<div class="line"><strong>${c.priority} • ${c.category}</strong><div class="muted">${c.status} • ${c.message||''}</div></div>`).join('')||'<div class="muted" style="margin-top:8px">No support case.</div>'}<h2>Timeline</h2>${events.slice(0,8).map(e=>`<div class="line"><strong>${e.type}</strong><div class="muted">${new Date(e.created_at).toLocaleString()}</div></div>`).join('')||'<div class="muted">No events.</div>'}</aside></div>`}window.addEventListener('storage',render);render();</script></body></html>
