<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOADIN Trip Experience</title><style>
:root{font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#10223a}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;background:#102a46;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;z-index:5}.brand{font-weight:900;font-size:24px}.brand b{color:#ff7a00}.back{color:#fff;text-decoration:none;border:1px solid #ffffff35;border-radius:12px;padding:8px 12px}.wrap{max-width:980px;margin:auto;padding:22px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}.tabs button{border:0;padding:12px;border-radius:14px;background:#e9eef4;font-weight:800;cursor:pointer}.tabs button.active{background:#ff7a00;color:#fff}.card{background:#fff;border:1px solid #e9edf2;border-radius:22px;padding:20px;box-shadow:0 10px 30px #102a4610;margin-bottom:16px}.muted{color:#67788d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.metric{background:#f8fafc;border-radius:16px;padding:14px}.metric small{display:block;color:#718096}.metric strong{font-size:20px}.progress{height:12px;background:#e9edf2;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#ff7a00}.map{height:300px;background:linear-gradient(135deg,#dfe9f2,#f9fbfd);border-radius:20px;position:relative;overflow:hidden;border:1px solid #d8e1ea}.road{position:absolute;width:120%;height:18px;background:#c0cad5;transform:rotate(-16deg);left:-10%;top:46%;border-radius:99px}.pin{position:absolute;width:16px;height:16px;border-radius:50%;background:#ff7a00;border:4px solid #fff;box-shadow:0 4px 14px #0003}.p1{left:16%;top:64%}.p2{left:42%;top:50%}.p3{left:66%;top:38%}.p4{right:12%;top:26%;background:#102a46}.gpsbox{position:absolute;left:16px;bottom:16px;background:#fff;padding:10px 12px;border-radius:12px;box-shadow:0 8px 24px #102a4620;font-size:12px}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #eef2f6}.pill{padding:5px 10px;border-radius:999px;background:#fff3e8;color:#c65d00;font-weight:800;font-size:12px}.notify{padding:14px;border-radius:16px;background:#f8fafc}.notify.opened{opacity:.65}.notify button{border:0;background:#102a46;color:#fff;padding:7px 10px;border-radius:9px;font-weight:800}.stage{display:flex;gap:10px;align-items:center;padding:10px 0}.dot{width:14px;height:14px;border-radius:50%;background:#ff7a00;flex:0 0 14px}.error{padding:12px;border-radius:12px;background:#fff1f1;color:#a51f1f}@media(max-width:700px){.tabs{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.map{height:240px}}</style></head><body>
<header class="top"><div class="brand">LOAD<b>IN</b> CUSTOMER</div><a class="back" href="/customer">Back to App</a></header><main class="wrap"><div class="tabs"><button data-tab="tracking" class="active">Live Tracking</button><button data-tab="payment">Payment</button><button data-tab="notifications">Notifications</button><button data-tab="shifting">Full Shifting</button></div><div id="view"></div></main>
<script type="module">import{experienceStore}from'../shared/experience-store.js';import{loadinData}from'../shared/loadin-data.js';const view=document.querySelector('#view');const buttons=[...document.querySelectorAll('[data-tab]')];const money=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(v||0));const terminal=new Set(['COMPLETED','CANCELLED','FAILED']);function statusProgress(s){return({SEARCHING:10,ASSIGNED:25,PARTNER_ARRIVING:40,AT_PICKUP:55,IN_PROGRESS:78,COMPLETED:100,CANCELLED:100,FAILED:100})[s]||5}async function currentBooking(){const rows=await loadinData.myBookings();return rows.find(b=>!terminal.has(b.status))||rows[0]||null}function setTab(t){buttons.forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render(t);history.replaceState(null,'',`?tab=${t}`)}buttons.forEach(b=>b.onclick=()=>setTab(b.dataset.tab));async function render(t){view.innerHTML='<section class="card"><p class="muted">Loading…</p></section>';try{if(t==='payment')return await pay();if(t==='notifications')return await notes();if(t==='shifting')return shifting();await track()}catch(e){view.innerHTML=`<section class="card"><div class="error">${e.message}</div></section>`}}async function track(){if(loadinData.mode==='DEMO'){const x=experienceStore.tracking();view.innerHTML=trackingHtml({status:x.status,service:x.service,pickup:x.pickup,drop:x.drop,progress:x.progress,partner:x.partner,eta:x.eta,fare:x.fare,points:[],active:!x.empty});return}const b=await currentBooking();if(!b){view.innerHTML='<section class="card"><h1>No booking yet</h1><p class="muted">Create a booking from Customer App.</p></section>';return}const snap=await loadinData.bookingTrackingSnapshot(b.id);view.innerHTML=trackingHtml({status:b.status,service:b.service_code,pickup:b.pickup_address,drop:b.drop_address,progress:statusProgress(b.status),partner:b.partner_id?'Verified Partner':'Searching',eta:snap.points?.length?'GPS live':'Waiting for GPS',fare:b.locked_fare,points:snap.points||[],active:Boolean(snap.session?.active)})}function trackingHtml(x){const last=x.points?.[0];return `<section class="card"><span class="pill">${String(x.status||'').replaceAll('_',' ')}</span><h1>${x.service||'LOADIN Trip'}</h1><p class="muted">${x.pickup||'Pickup'} → ${x.drop||'Drop'}</p><div class="progress"><i style="width:${x.progress||0}%"></i></div></section><section class="card"><div class="map"><div class="road"></div><i class="pin p1"></i><i class="pin p2"></i><i class="pin p3"></i><i class="pin p4"></i><div class="gpsbox"><strong>${x.active?'GPS STREAM ACTIVE':'GPS STREAM'}</strong><br>${last?`${Number(last.latitude).toFixed(5)}, ${Number(last.longitude).toFixed(5)} • ${x.points.length} recent point(s)`:'Waiting for partner location update'}</div></div></section><section class="grid"><div class="card metric"><small>Partner</small><strong>${x.partner||'—'}</strong></div><div class="card metric"><small>Tracking</small><strong>${x.eta||'—'}</strong></div><div class="card metric"><small>Fare Locked</small><strong>${money(x.fare||0)}</strong></div><div class="card metric"><small>Safety</small><strong>Participant-scoped GPS</strong></div></section>`}async function pay(){if(loadinData.mode==='DEMO'){const p=experienceStore.payment();view.innerHTML=paymentHtml(p);return}const b=await currentBooking();if(!b){view.innerHTML='<section class="card"><h1>No payment yet</h1></section>';return}view.innerHTML=paymentHtml({bookingId:b.id,fare:Number(b.locked_fare||0),extras:0,customerTotal:Number(b.locked_fare||0),mode:b.customer_payment_mode||'ONLINE',gatewayFeeChargedToCustomer:0,platformCommission:Math.round(Number(b.locked_fare||0)*.15),partnerEntitlement:Math.round(Number(b.locked_fare||0)*.85)})}function paymentHtml(p){return `<section class="card"><span class="pill">FARE LOCK</span><h1>Payment Summary</h1><p class="muted">Transparent customer total. No hidden off-app charge.</p><div class="list"><div class="row"><span>Booking</span><strong>${p.bookingId||'Demo'}</strong></div><div class="row"><span>Locked Fare</span><strong>${money(p.fare)}</strong></div><div class="row"><span>Approved Extras</span><strong>${money(p.extras)}</strong></div><div class="row"><span>Customer Total</span><strong>${money(p.customerTotal)}</strong></div><div class="row"><span>Payment Mode</span><strong>${p.mode}</strong></div><div class="row"><span>Extra Gateway Fee to Customer</span><strong>${money(p.gatewayFeeChargedToCustomer)}</strong></div></div></section><section class="grid"><div class="card metric"><small>LOADIN Commission (commission plan)</small><strong>${money(p.platformCommission)}</strong></div><div class="card metric"><small>Partner Entitlement</small><strong>${money(p.partnerEntitlement)}</strong></div></section>`}async function notes(){const rows=loadinData.mode==='DEMO'?experienceStore.notifications().map((n,i)=>({id:`demo-${i}`,notification_type:n.type,title:n.title,body:n.body,status:'QUEUED'})):await loadinData.myNotifications();view.innerHTML=`<section class="card"><h1>Notification Center</h1><p class="muted">Booking, safety, fare, GPS and proof updates in one place.</p><div class="list">${rows.map(n=>`<div class="notify ${n.status==='OPENED'?'opened':''}"><span class="pill">${n.notification_type||n.type}</span><h3>${n.title}</h3><p class="muted">${n.body}</p>${loadinData.mode==='LIVE'&&n.status!=='OPENED'?`<button data-open-notification="${n.id}">Mark opened</button>`:''}</div>`).join('')||'<p class="muted">No notifications yet.</p>'}</div></section>`;document.querySelectorAll('[data-open-notification]').forEach(b=>b.onclick=async()=>{await loadinData.markNotificationOpened(b.dataset.openNotification);await notes()})}function shifting(){const s=experienceStore.shifting();view.innerHTML=`<section class="card"><span class="pill">FULL SHIFTING</span><h1>Move Plan</h1><p class="muted">Inspection, inventory, skilled team and locked quote workflow.</p><div class="grid"><div class="metric"><small>Inspection</small><strong>${s.inspectionRequired?'Required':'Not required'}</strong></div><div class="metric"><small>Quote</small><strong>${money(s.quote)}</strong></div></div></section><section class="grid"><div class="card"><h2>Inventory</h2>${s.inventory.map(i=>`<div class="row"><span>${i.item}${i.fragile?' • Fragile':''}</span><strong>×${i.qty}</strong></div>`).join('')}</div><div class="card"><h2>Team</h2>${s.team.map(x=>`<div class="row"><span>${x}</span><strong>✓</strong></div>`).join('')}</div></section><section class="card"><h2>Workflow</h2>${s.stages.map(x=>`<div class="stage"><i class="dot"></i><strong>${x}</strong></div>`).join('')}</section>`}const initial=new URLSearchParams(location.search).get('tab')||'tracking';setTab(['tracking','payment','notifications','shifting'].includes(initial)?initial:'tracking');</script></body></html>
