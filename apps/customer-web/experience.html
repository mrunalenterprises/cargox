<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOADIN Trip Experience</title><style>
:root{font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#10223a}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;background:#102a46;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;z-index:5}.brand{font-weight:900;font-size:24px}.brand b{color:#ff7a00}.back{color:#fff;text-decoration:none;border:1px solid #ffffff35;border-radius:12px;padding:8px 12px}.wrap{max-width:980px;margin:auto;padding:22px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}.tabs button{border:0;padding:12px;border-radius:14px;background:#e9eef4;font-weight:800;cursor:pointer}.tabs button.active{background:#ff7a00;color:#fff}.card{background:#fff;border:1px solid #e9edf2;border-radius:22px;padding:20px;box-shadow:0 10px 30px #102a4610;margin-bottom:16px}.muted{color:#67788d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.metric{background:#f8fafc;border-radius:16px;padding:14px}.metric small{display:block;color:#718096}.metric strong{font-size:20px}.progress{height:12px;background:#e9edf2;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#ff7a00}.map{height:300px;background:linear-gradient(135deg,#dfe9f2,#f9fbfd);border-radius:20px;position:relative;overflow:hidden;border:1px solid #d8e1ea}.road{position:absolute;width:120%;height:18px;background:#c0cad5;transform:rotate(-16deg);left:-10%;top:46%;border-radius:99px}.pin{position:absolute;width:16px;height:16px;border-radius:50%;background:#ff7a00;border:4px solid #fff;box-shadow:0 4px 14px #0003}.p1{left:16%;top:64%}.p2{left:42%;top:50%}.p3{left:66%;top:38%}.p4{right:12%;top:26%;background:#102a46}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #eef2f6}.pill{padding:5px 10px;border-radius:999px;background:#fff3e8;color:#c65d00;font-weight:800;font-size:12px}.notify{padding:14px;border-radius:16px;background:#f8fafc}.stage{display:flex;gap:10px;align-items:center;padding:10px 0}.dot{width:14px;height:14px;border-radius:50%;background:#ff7a00;flex:0 0 14px}@media(max-width:700px){.tabs{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.map{height:240px}}</style></head><body>
<header class="top"><div class="brand">LOAD<b>IN</b> CUSTOMER</div><a class="back" href="/customer">Back to App</a></header><main class="wrap"><div class="tabs"><button data-tab="tracking" class="active">Live Tracking</button><button data-tab="payment">Payment</button><button data-tab="notifications">Notifications</button><button data-tab="shifting">Full Shifting</button></div><div id="view"></div></main>
<script type="module">import{experienceStore}from'../shared/experience-store.js';const view=document.querySelector('#view');const buttons=[...document.querySelectorAll('[data-tab]')];const money=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(v);function setTab(t){buttons.forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render(t)}buttons.forEach(b=>b.onclick=()=>setTab(b.dataset.tab));function render(t){if(t==='payment')return pay();if(t==='notifications')return notes();if(t==='shifting')return shifting();track()}function track(){const x=experienceStore.tracking();view.innerHTML=`<section class="card"><span class="pill">${x.status}</span><h1>${x.empty?'No active booking':x.service}</h1><p class="muted">${x.empty?'Create a booking from Customer App first.':`${x.pickup} → ${x.drop}`}</p><div class="progress"><i style="width:${x.progress}%"></i></div></section><section class="card"><div class="map"><div class="road"></div><i class="pin p1"></i><i class="pin p2"></i><i class="pin p3"></i><i class="pin p4"></i></div></section><section class="grid"><div class="card metric"><small>Partner</small><strong>${x.partner||'—'}</strong></div><div class="card metric"><small>ETA</small><strong>${x.eta||'—'}</strong></div><div class="card metric"><small>Fare Locked</small><strong>${money(x.fare||0)}</strong></div><div class="card metric"><small>Safety</small><strong>Trip share active</strong></div></section>`}function pay(){const p=experienceStore.payment();view.innerHTML=`<section class="card"><span class="pill">FARE LOCK</span><h1>Payment Summary</h1><p class="muted">Transparent customer total. No hidden off-app charge.</p><div class="list"><div class="row"><span>Booking</span><strong>${p.bookingId||'Demo'}</strong></div><div class="row"><span>Locked Fare</span><strong>${money(p.fare)}</strong></div><div class="row"><span>Approved Extras</span><strong>${money(p.extras)}</strong></div><div class="row"><span>Customer Total</span><strong>${money(p.customerTotal)}</strong></div><div class="row"><span>Payment Mode</span><strong>${p.mode}</strong></div><div class="row"><span>Extra Gateway Fee to Customer</span><strong>${money(p.gatewayFeeChargedToCustomer)}</strong></div></div></section><section class="grid"><div class="card metric"><small>LOADIN Commission</small><strong>${money(p.platformCommission)}</strong></div><div class="card metric"><small>Partner Entitlement</small><strong>${money(p.partnerEntitlement)}</strong></div></section>`}function notes(){view.innerHTML=`<section class="card"><h1>Notification Center</h1><p class="muted">Booking, safety, fare and proof updates in one place.</p><div class="list">${experienceStore.notifications().map(n=>`<div class="notify"><span class="pill">${n.type}</span><h3>${n.title}</h3><p class="muted">${n.body}</p></div>`).join('')}</div></section>`}function shifting(){const s=experienceStore.shifting();view.innerHTML=`<section class="card"><span class="pill">FULL SHIFTING</span><h1>Move Plan</h1><p class="muted">Inspection, inventory, skilled team and locked quote workflow.</p><div class="grid"><div class="metric"><small>Inspection</small><strong>${s.inspectionRequired?'Required':'Not required'}</strong></div><div class="metric"><small>Quote</small><strong>${money(s.quote)}</strong></div></div></section><section class="grid"><div class="card"><h2>Inventory</h2>${s.inventory.map(i=>`<div class="row"><span>${i.item}${i.fragile?' • Fragile':''}</span><strong>×${i.qty}</strong></div>`).join('')}</div><div class="card"><h2>Team</h2>${s.team.map(x=>`<div class="row"><span>${x}</span><strong>✓</strong></div>`).join('')}</div></section><section class="card"><h2>Workflow</h2>${s.stages.map(x=>`<div class="stage"><i class="dot"></i><strong>${x}</strong></div>`).join('')}</section>`}render('tracking');</script></body></html>
