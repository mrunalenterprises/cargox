<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOADIN Recurring Routes</title><style>body{font-family:Inter,Arial,sans-serif;background:#f7f9fc;color:#10233d;margin:0}.wrap{max-width:960px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#102b49,#173b62);color:#fff;padding:26px;border-radius:24px}.hero b{color:#ff7a00}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 24px #10233d12}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{padding:12px;border:1px solid #dfe6ee;border-radius:12px}.days{display:flex;gap:7px;flex-wrap:wrap}.days label{background:#f2f5f8;padding:8px 10px;border-radius:10px}.btn{background:#ff7a00;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.row{border-top:1px solid #edf1f5;padding:12px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf5ff;color:#1769aa;font-weight:800;font-size:12px}.occ{font-size:13px;color:#617186}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>LOAD<b>IN</b> Scheduled & Recurring Routes</h1><p>Office pickup/drop, repeat business movement and preferred partner scheduling.</p></section><section class="grid"><article class="card"><h2>Create Repeat Route</h2><div class="field"><label>Name</label><input id="name" value="Office Material Route"></div><div class="field"><label>Pickup</label><input id="pickup" value="Cidco, Sambhaji Nagar"></div><div class="field"><label>Drop</label><input id="drop" value="Waluj MIDC"></div><div class="field"><label>Service</label><select id="service"><option value="LOADING_VEHICLE">Loading Vehicle</option><option value="PARCEL_2W">2-Wheeler Parcel</option><option value="HELPER">Helper</option><option value="FULL_SHIFTING">Full Shifting</option></select></div><div class="field"><label>Start date</label><input id="start" type="date"></div><div class="field"><label>Time</label><input id="time" type="time" value="09:00"></div><div class="field"><label>Weekdays</label><div class="days" id="days"></div></div><label><input id="preferred" type="checkbox" checked> Prefer favourite partner when eligible</label><p><button class="btn" id="save">Create recurring route</button></p></article><article class="card"><h2>My Repeat Routes</h2><div id="routes"></div></article></section></main><script type="module">import{operationsStore}from'../shared/operations-store.js';const els={days:document.querySelector('#days'),name:document.querySelector('#name'),pickup:document.querySelector('#pickup'),drop:document.querySelector('#drop'),service:document.querySelector('#service'),start:document.querySelector('#start'),time:document.querySelector('#time'),preferred:document.querySelector('#preferred'),save:document.querySelector('#save'),routes:document.querySelector('#routes')};for(const d of ['MON','TUE','WED','THU','FRI','SAT'])els.days.insertAdjacentHTML('beforeend',`<label><input type="checkbox" value="${d}" ${['MON','WED','FRI'].includes(d)?'checked':''}> ${d}</label>`);els.start.value=new Date(Date.now()+86400000).toISOString().slice(0,10);function render(){const rows=operationsStore.read().recurringRoutes;els.routes.innerHTML=rows.length?rows.map(r=>`<div class="row"><div><strong>${r.name}</strong> <span class="pill">${r.active?'ACTIVE':'PAUSED'}</span></div><div>${r.pickup} → ${r.drop}</div><div class="occ">${r.weekdays.join(', ')} • ${r.time} • ${r.service}${r.preferredPartner?' • Preferred Partner':''}</div><div class="occ">Next: ${r.occurrences.slice(0,3).map(o=>`${o.date} ${o.time}`).join(' · ')}</div>${r.active?`<button data-pause="${r.id}">Pause</button>`:''}</div>`).join(''):'<p>No recurring route yet.</p>';document.querySelectorAll('[data-pause]').forEach(b=>b.onclick=()=>{operationsStore.pauseRecurringRoute(b.dataset.pause);render()})}els.save.onclick=()=>{const weekdays=[...els.days.querySelectorAll('input:checked')].map(x=>x.value);try{operationsStore.addRecurringRoute({name:els.name.value,pickup:els.pickup.value,drop:els.drop.value,service:els.service.value,startDate:els.start.value,time:els.time.value,weekdays,preferredPartner:els.preferred.checked});render()}catch(e){alert(e.message)}};render();</script></body></html>
