name: LOADIN UI Browser CI

on:
  push:
    branches: [loadin-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start LOADIN preview
        run: |
          node scripts/preview-server.mjs > /tmp/loadin-preview.log 2>&1 &
          echo $! > /tmp/loadin-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/loadin-preview.log
          exit 1
      - name: Browser test Customer Partner Admin Fleet
        run: LOADIN_APP_BASE=http://127.0.0.1:4173 node scripts/ui-browser-smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadin-ui-browser-screenshots
          path: artifacts/ui-smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop preview
        if: always()
        run: kill "$(cat /tmp/loadin-preview.pid)" 2>/dev/null || true
