name: LOADIN Live Web

on:
  push:
    branches: [loadin-build]
    paths:
      - 'apps/**'
      - 'src/**'
      - 'scripts/build-pages.mjs'
      - 'firebase-messaging-sw.js'
      - 'package.json'
      - '.github/workflows/loadin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: loadin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LOADIN branch
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build live LOADIN web
        env:
          LOADIN_PUBLIC_BASE: ${{ steps.pages.outputs.base_path }}
          LOADIN_SUPABASE_URL: https://wnehhzzdpkzwtxaipgdv.supabase.co
          LOADIN_SUPABASE_ANON_KEY: sb_publishable_bNvuThgSTbF-zHvyG3avIg_XCdwQ0zH
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy LOADIN
        id: deployment
        uses: actions/deploy-pages@v4
