name: LOADIN Flutter APK CI

on:
  push:
    branches: [loadin-build]
    paths:
      - 'apps/customer_app/**'
      - 'apps/partner_app/**'
      - '.github/workflows/loadin-flutter-apk-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loadin-flutter-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  LOADIN_SUPABASE_URL: https://wnehhzzdpkzwtxaipgdv.supabase.co
  LOADIN_SUPABASE_PUBLISHABLE_KEY: sb_publishable_bNvuThgSTbF-zHvyG3avIg_XCdwQ0zH

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer_app
            project: loadin_customer
            artifact: loadin-customer-live-qa-apk
          - app: partner_app
            project: loadin_partner
            artifact: loadin-partner-live-qa-apk
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android shell
        run: flutter create --platforms=android --org com.mrunaltechnologies --project-name ${{ matrix.project }} --no-pub .
        working-directory: apps/${{ matrix.app }}
      - name: Get packages
        run: flutter pub get
        working-directory: apps/${{ matrix.app }}
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: apps/${{ matrix.app }}
      - name: Test
        run: flutter test
        working-directory: apps/${{ matrix.app }}
      - name: Build live Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=LOADIN_SUPABASE_URL=${{ env.LOADIN_SUPABASE_URL }}
          --dart-define=LOADIN_SUPABASE_PUBLISHABLE_KEY=${{ env.LOADIN_SUPABASE_PUBLISHABLE_KEY }}
        working-directory: apps/${{ matrix.app }}
      - name: Rename APK
        shell: bash
        run: |
          if [ "${{ matrix.app }}" = "customer_app" ]; then
            cp apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk /tmp/loadin-customer.apk
          else
            cp apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk /tmp/loadin-partner.apk
          fi
      - name: Upload live QA APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/loadin-*.apk
          if-no-files-found: error
          retention-days: 14

  publish-apks:
    name: Publish stable APK downloads
    needs: android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/loadin-build' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Download Customer APK
        uses: actions/download-artifact@v4
        with:
          name: loadin-customer-live-qa-apk
          path: dist/customer
      - name: Download Partner APK
        uses: actions/download-artifact@v4
        with:
          name: loadin-partner-live-qa-apk
          path: dist/partner
      - name: Prepare fixed APK filenames
        shell: bash
        run: |
          set -euo pipefail
          cp dist/customer/loadin-customer.apk dist/loadin-customer.apk
          cp dist/partner/loadin-partner.apk dist/loadin-partner.apk
          test -s dist/loadin-customer.apk
          test -s dist/loadin-partner.apk
          ls -lh dist/loadin-customer.apk dist/loadin-partner.apk
      - name: Publish latest LOADIN live QA release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="loadin-qa-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            dist/loadin-customer.apk \
            dist/loadin-partner.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LOADIN Live QA ${GITHUB_RUN_NUMBER}" \
            --notes "Automated LOADIN Customer and Partner live QA APKs from ${GITHUB_SHA}." \
            --latest
