name: LOADIN CI

on:
  push:
    branches: [loadin-build]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migration continuity
        run: node scripts/check-migrations.mjs
      - name: Domain tests
        run: npm test
