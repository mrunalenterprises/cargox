name: LOADIN CI

on:
  push:
    branches: [loadin-build]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loadin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loadin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migration continuity
        run: node scripts/check-migrations.mjs
      - name: Fresh database bootstrap
        run: psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f scripts/ci/fresh-db-bootstrap.sql
      - name: Apply migrations on fresh database
        run: |
          set -euo pipefail
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Database security smoke
        run: |
          psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f scripts/ci/security-smoke.sql
          psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f scripts/ci/onboarding-security-smoke.sql
          psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f scripts/ci/production-readiness-smoke.sql
          psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f scripts/ci/payment-security-smoke.sql
          psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f scripts/ci/map-security-smoke.sql
          psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f scripts/ci/auth-security-smoke.sql
          psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f scripts/ci/account-notification-security-smoke.sql
      - name: Runtime public config contract
        run: |
          rm -f loadin-config.json
          LOADIN_PUBLIC_SUPABASE_URL=https://example.supabase.co \
          LOADIN_PUBLIC_SUPABASE_ANON_KEY=public-anon-test \
          LOADIN_PUBLIC_GOOGLE_MAPS_API_KEY=browser-map-test \
          LOADIN_PUBLIC_PAYMENT_PROVIDER=RAZORPAY \
          LOADIN_PUBLIC_PAYMENT_KEY=rzp_test_public \
          LOADIN_PUBLIC_PAYMENT_API_BASE=https://payments.example.com/loadin \
          LOADIN_PUBLIC_ADMIN_API_BASE=https://api.example.com/loadin \
          LOADIN_PUBLIC_FIREBASE_API_KEY=firebase-public \
          LOADIN_PUBLIC_FIREBASE_AUTH_DOMAIN=example.firebaseapp.com \
          LOADIN_PUBLIC_FIREBASE_PROJECT_ID=example \
          LOADIN_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=123456 \
          LOADIN_PUBLIC_FIREBASE_APP_ID=app-public \
          LOADIN_PUBLIC_FIREBASE_VAPID_KEY=vapid-public \
          node scripts/write-runtime-config.mjs | grep -q '"ok":true'
          node -e "const c=require('./loadin-config.json'); if(c.supabaseUrl!=='https://example.supabase.co'||c.paymentProvider!=='RAZORPAY') process.exit(1)"
          ! grep -Eiq 'service[_-]?role|private[_-]?key|key[_-]?secret|webhook[_-]?secret' loadin-config.json
          rm -f loadin-config.json
      - name: Domain tests
        run: npm test
      - name: Frontend syntax smoke
        run: |
          node --check src/platform/supabase-rest.js
          node --check apps/shared/runtime-config.js
          node --check apps/shared/loadin-data.js
          node --check apps/shared/partner-production.js
          node --check apps/shared/admin-production.js
          node --check apps/shared/payment-production.js
          node --check apps/shared/maps-production.js
          node --check apps/shared/auth-production.js
          node --check apps/shared/live-auth-guard.js
          node --check apps/shared/notifications-production.js
          node --check apps/shared/push-production.js
          node --check apps/shared/notification-center-page.js
          node --check apps/shared/production-readiness.js
          node --check apps/auth-web/app.js
          node --check apps/customer-web/app.js
          node --check apps/customer-web/experience.js
          node --check apps/partner-web/app.js
          node --check apps/partner-web/onboarding.js
          node --check apps/admin-web/app.js
          node --check apps/admin-web/booking-deeplink.js
          node --check apps/admin-web/ops-map.js
          node --check apps/admin-web/review-center.js
          node --check apps/admin-web/document-renewals.js
          node --check apps/fleet-web/app.js
          node --check services/notification-worker/worker.mjs
          node --check services/payment-worker/worker.mjs
          node --check scripts/write-runtime-config.mjs
          node --check scripts/production-smoke.mjs
      - name: Worker readiness contracts
        run: |
          SUPABASE_URL=https://example.supabase.co \
          SUPABASE_SERVICE_ROLE_KEY=test \
          FCM_PROJECT_ID=test-project \
          FCM_CLIENT_EMAIL=test@example.com \
          FCM_PRIVATE_KEY=dummy \
          node services/notification-worker/worker.mjs --check | grep -q '"ok":true'
          PORT=8788 \
          SUPABASE_URL=https://example.supabase.co \
          SUPABASE_SERVICE_ROLE_KEY=test \
          PAYMENT_PROVIDER=RAZORPAY \
          RAZORPAY_KEY_ID=rzp_test_dummy \
          RAZORPAY_KEY_SECRET=dummy \
          RAZORPAY_WEBHOOK_SECRET=dummy \
          LOADIN_ALLOWED_ORIGINS=http://127.0.0.1:4173 \
          node services/payment-worker/worker.mjs > /tmp/loadin-payment.log 2>&1 &
          PAYMENT_PID=$!
          trap 'kill $PAYMENT_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8788/health > /tmp/payment-health.json; then break; fi
            sleep 0.2
          done
          grep -q 'loadin-payment-worker' /tmp/payment-health.json
          curl -fsS http://127.0.0.1:8788/ready | grep -q '"ok":true'
          curl -fsS -X OPTIONS -H 'Origin: http://127.0.0.1:4173' http://127.0.0.1:8788/session -D /tmp/cors-headers.txt -o /dev/null
          grep -qi 'access-control-allow-origin: http://127.0.0.1:4173' /tmp/cors-headers.txt
          test "$(curl -sS -o /tmp/blocked.json -w '%{http_code}' -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -d '{"bookingId":"X"}' http://127.0.0.1:8788/session)" = "403"
          kill $PAYMENT_PID || true
          trap - EXIT
      - name: Preview smoke
        run: |
          node scripts/preview-server.mjs > /tmp/loadin-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/preview.html; then break; fi
            sleep 0.25
          done
          grep -q "LOADIN Preview" /tmp/preview.html
          grep -q "Secure Login / OTP" /tmp/preview.html
          curl -fsS http://127.0.0.1:4173/apps/shared/runtime-config.js | grep -q "loadPublicConfig"
          curl -fsS http://127.0.0.1:4173/loadin-config.example.json | grep -q "supabaseAnonKey"
          curl -fsS http://127.0.0.1:4173/auth | grep -q "Secure sign in"
          curl -fsS http://127.0.0.1:4173/apps/auth-web/app.js | grep -q "verifyOtp"
          curl -fsS http://127.0.0.1:4173/apps/shared/auth-production.js | grep -q "get_my_loadin_identity"
          curl -fsS http://127.0.0.1:4173/apps/shared/live-auth-guard.js | grep -q "enforceLiveAuth"
          curl -fsS http://127.0.0.1:4173/apps/shared/notifications-production.js | grep -q "get_my_notification_center"
          curl -fsS http://127.0.0.1:4173/apps/shared/production-readiness.js | grep -q "paymentHealth"
          curl -fsS http://127.0.0.1:4173/website | grep -q "LOADIN — Local Logistics"
          curl -fsS http://127.0.0.1:4173/customer | grep -q "Account & Security"
          curl -fsS http://127.0.0.1:4173/customer-account | grep -q "Account & Security"
          curl -fsS http://127.0.0.1:4173/customer-notifications | grep -q "Trip & account alerts"
          curl -fsS http://127.0.0.1:4173/customer-experience | grep -q "LOADIN Trip Experience"
          curl -fsS http://127.0.0.1:4173/apps/customer-web/experience.js | grep -q "googleMapsProduction"
          curl -fsS http://127.0.0.1:4173/apps/shared/maps-production.js | grep -q "renderTrackingMap"
          curl -fsS http://127.0.0.1:4173/customer-checkout | grep -q "Secure online payment"
          curl -fsS http://127.0.0.1:4173/apps/shared/payment-production.js | grep -q "createSession"
          curl -fsS http://127.0.0.1:4173/customer-recurring | grep -q "LOADIN Recurring Routes"
          curl -fsS http://127.0.0.1:4173/customer-business | grep -q "LOADIN Business Account"
          curl -fsS http://127.0.0.1:4173/customer-rewards | grep -q "LOADIN Rewards & Favourites"
          curl -fsS http://127.0.0.1:4173/customer-reliability | grep -q "LOADIN Customer Reliability & Cargo Protection"
          curl -fsS http://127.0.0.1:4173/customer-shifting | grep -q "LOADIN Full Shifting Planner"
          curl -fsS http://127.0.0.1:4173/partner | grep -q "notifications.html"
          curl -fsS http://127.0.0.1:4173/partner-notifications | grep -q "Jobs, trips & payouts"
          curl -fsS http://127.0.0.1:4173/partner-readiness | grep -q "Go Online Readiness"
          curl -fsS http://127.0.0.1:4173/partner-onboarding | grep -q "LOADIN Partner Onboarding"
          curl -fsS http://127.0.0.1:4173/apps/partner-web/onboarding.js | grep -q "submitPartnerOnboarding"
          curl -fsS http://127.0.0.1:4173/partner-documents | grep -q "LOADIN Partner Documents"
          curl -fsS http://127.0.0.1:4173/partner-renewals | grep -q "LOADIN Document Renewals"
          curl -fsS http://127.0.0.1:4173/partner-special | grep -q "LOADIN Special Jobs"
          curl -fsS http://127.0.0.1:4173/partner-wallet | grep -q "LOADIN Partner Wallet"
          curl -fsS http://127.0.0.1:4173/partner-quality | grep -q "LOADIN Partner Quality & Demand"
          curl -fsS http://127.0.0.1:4173/partner-plan | grep -q "LOADIN Partner Plan Center"
          curl -fsS http://127.0.0.1:4173/admin | grep -q "production-readiness.html"
          curl -fsS http://127.0.0.1:4173/admin-readiness | grep -q "Production configuration health"
          curl -fsS http://127.0.0.1:4173/apps/admin-web/booking-deeplink.js | grep -q "booking-detail.html"
          curl -fsS http://127.0.0.1:4173/admin-map | grep -q "LOADIN Admin Live Ops Map"
          curl -fsS http://127.0.0.1:4173/apps/admin-web/ops-map.js | grep -q "liveMapSnapshot"
          curl -fsS http://127.0.0.1:4173/admin-booking | grep -q "LOADIN Admin Booking Detail"
          curl -fsS http://127.0.0.1:4173/admin-settings | grep -q "LOADIN Operations Settings"
          curl -fsS http://127.0.0.1:4173/admin-review | grep -q "LOADIN Admin Review Center"
          curl -fsS http://127.0.0.1:4173/apps/admin-web/review-center.js | grep -q "adminFinalizePartner"
          curl -fsS http://127.0.0.1:4173/admin-documents | grep -q "LOADIN Admin Document Renewals"
          curl -fsS http://127.0.0.1:4173/apps/admin-web/document-renewals.js | grep -q "reviewPartnerDocument"
          curl -fsS http://127.0.0.1:4173/admin-finance | grep -q "LOADIN Admin Finance Center"
          curl -fsS http://127.0.0.1:4173/admin-safety | grep -q "LOADIN Admin Safety Center"
          curl -fsS http://127.0.0.1:4173/admin-growth | grep -q "LOADIN Admin Growth Center"
          curl -fsS http://127.0.0.1:4173/admin-support | grep -q "LOADIN Admin Support SLA Center"
          curl -fsS http://127.0.0.1:4173/admin-city-services | grep -q "LOADIN Admin City & Service Center"
          curl -fsS http://127.0.0.1:4173/admin-staff | grep -q "LOADIN Admin Staff & Audit"
          curl -fsS http://127.0.0.1:4173/fleet | grep -q "live-auth-guard"
          curl -fsS http://127.0.0.1:4173/fleet-compliance | grep -q "LOADIN Fleet Compliance"
          curl -fsS http://127.0.0.1:4173/fleet-reports | grep -q "LOADIN Fleet Reports"
          curl -fsS http://127.0.0.1:4173/fleet-assignments | grep -q "LOADIN Fleet Assignment Planner"
          curl -fsS http://127.0.0.1:4173/fleet-dispatch | grep -q "LOADIN Fleet Dispatch Board"
          LOADIN_APP_BASE=http://127.0.0.1:4173 node scripts/production-smoke.mjs
