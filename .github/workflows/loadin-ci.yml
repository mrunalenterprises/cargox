name: LOADIN CI

on:
  push:
    branches: [loadin-build]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loadin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loadin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migration continuity
        run: node scripts/check-migrations.mjs
      - name: Fresh database bootstrap
        run: psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f scripts/ci/fresh-db-bootstrap.sql
      - name: Apply migrations on fresh database
        run: |
          set -euo pipefail
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Database security smoke
        run: psql -h 127.0.0.1 -U postgres -d loadin_ci -v ON_ERROR_STOP=1 -f scripts/ci/security-smoke.sql
      - name: Domain tests
        run: npm test
      - name: Preview smoke
        run: |
          node scripts/preview-server.mjs > /tmp/loadin-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/preview.html; then break; fi
            sleep 0.25
          done
          grep -q "LOADIN Preview" /tmp/preview.html
          curl -fsS http://127.0.0.1:4173/customer | grep -q "LOADIN Customer"
          curl -fsS http://127.0.0.1:4173/partner | grep -q "LOADIN Partner"
          curl -fsS http://127.0.0.1:4173/admin | grep -q "LOADIN Admin"
          curl -fsS http://127.0.0.1:4173/fleet | grep -q "LOADIN Fleet"
