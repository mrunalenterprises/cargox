name: PIP PIP Android debug APKs
on:
  workflow_dispatch:
  push:
    branches: [feature/passenger-phase1-v1]
    paths:
      - 'apps/customer/**'
      - 'apps/partner/**'
      - 'packages/cargox_demo/**'
      - 'packages/cargox_ui/**'
      - 'packages/cargox_staging/**'
      - '.github/workflows/android-debug.yml'
jobs:
  debug-apks:
    name: Build ${{ matrix.app }} debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [customer, partner]
    env:
      # Loopback-only fictional test service. Never ship this build as a public app.
      CARGOX_DEBUG_API: http://127.0.0.1:4174
      PIPPIP_STAGING_URL: https://ifnpbeozmbdofyczbvme.supabase.co
      # This is the restricted public publishable key, NEVER a service-role key.
      PIPPIP_STAGING_PUBLISHABLE_KEY: sb_publishable_ILGlC1HGsEEjK6C7cB_kJw_Z__QOMoT
    steps:
      - name: Checkout PIP PIP source
        uses: actions/checkout@v4
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout known Flutter SDK release
        uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: 3.47.5
          path: .flutter-sdk
      - name: Configure Flutter
        run: |
          echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Flutter SDK and Android environment
        run: |
          flutter --version
          flutter doctor -v
      - name: Fetch Flutter dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Verify app analysis
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze
      - name: Run widget regressions
        working-directory: apps/${{ matrix.app }}
        run: flutter test
      - name: Build explicitly local-only Android debug APK
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter build apk --debug \
            --dart-define=CARGOX_DEMO_API="$CARGOX_DEBUG_API" \
            --dart-define=PIPPIP_STAGING_URL="$PIPPIP_STAGING_URL" \
            --dart-define=PIPPIP_STAGING_PUBLISHABLE_KEY="$PIPPIP_STAGING_PUBLISHABLE_KEY"
      - name: Validate output and record digest
        shell: bash
        run: |
          out="apps/${{ matrix.app }}/build/app/outputs/flutter-apk"
          test -s "$out/app-debug.apk"
          (cd "$out" && sha256sum app-debug.apk > SHA256SUMS.txt)
          ls -lh "$out/app-debug.apk"
          cat "$out/SHA256SUMS.txt"
      - name: Publish short-lived test artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip-pip-${{ matrix.app }}-debug
          path: |
            apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
            apps/${{ matrix.app }}/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 5
