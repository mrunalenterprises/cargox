name: PIP PIP Android debug APKs
on:
  workflow_dispatch:
  push:
    branches: [feature/passenger-phase1-v1]
    paths:
      - 'apps/customer/**'
      - 'apps/partner/**'
      - 'packages/cargox_demo/**'
      - 'packages/cargox_ui/**'
      - 'packages/cargox_staging/**'
      - '.github/workflows/android-debug.yml'
jobs:
  debug-apks:
    name: Build ${{ matrix.app }} debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [customer, partner]
    env:
      # Loopback-only fictional test service. Never ship this build as a public app.
      CARGOX_DEBUG_API: http://127.0.0.1:4174
      PIPPIP_STAGING_URL: https://ifnpbeozmbdofyczbvme.supabase.co
      # This is the restricted public publishable key, NEVER a service-role key.
      PIPPIP_STAGING_PUBLISHABLE_KEY: sb_publishable_ILGlC1HGsEEjK6C7cB_kJw_Z__QOMoT
    steps:
      - name: Checkout PIP PIP source
        uses: actions/checkout@v4
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout known Flutter SDK release
        uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: 3.47.5
          path: .flutter-sdk
      - name: Configure Flutter
        run: |
          echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Flutter SDK and Android environment
        run: |
          flutter --version
          flutter doctor -v
      - name: Fetch Flutter dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Verify app analysis
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze
      - name: Run widget regressions
        working-directory: apps/${{ matrix.app }}
        run: flutter test
      - name: Verify read-only pilot HTTPS endpoint
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 \
            -H "apikey: $PIPPIP_STAGING_PUBLISHABLE_KEY" \
            -H 'Accept: application/json' \
            "$PIPPIP_STAGING_URL/rest/v1/mobile_city_catalog?select=city,timezone,service")"
          PILOT_JSON="$response" node -e '
            const items=JSON.parse(process.env.PILOT_JSON);
            if(!Array.isArray(items) ||
               !items.every(x=>typeof x.city==="string" &&
                                typeof x.timezone==="string" &&
                                typeof x.service==="string"))
              throw new Error("Invalid public catalog response");
            console.log("HTTPS staging catalog reachable; approved rows: "+items.length);
          '
      - name: Build explicitly local-only Android debug APK
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter build apk --debug \
            --dart-define=CARGOX_DEMO_API="$CARGOX_DEBUG_API" \
            --dart-define=PIPPIP_STAGING_URL="$PIPPIP_STAGING_URL" \
            --dart-define=PIPPIP_STAGING_PUBLISHABLE_KEY="$PIPPIP_STAGING_PUBLISHABLE_KEY" \
            --dart-define=PIPPIP_PHONE_PILOT=true
      - name: Validate output and record digest
        shell: bash
        run: |
          out="apps/${{ matrix.app }}/build/app/outputs/flutter-apk"
          test -s "$out/app-debug.apk"
          (cd "$out" && sha256sum app-debug.apk > SHA256SUMS.txt)
          ls -lh "$out/app-debug.apk"
          cat "$out/SHA256SUMS.txt"
      - name: Publish short-lived test artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip-pip-${{ matrix.app }}-debug
          path: |
            apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
            apps/${{ matrix.app }}/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 5
      - name: Build compact Android ARM64 phone QA APK
        working-directory: apps/${{ matrix.app }}
        run: |
          # Android Gradle currently signs release variants with temporary
          # DEBUG keys. This is a smaller TEST APK, not a Play release.
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=CARGOX_DEMO_API="$CARGOX_DEBUG_API" \
            --dart-define=PIPPIP_STAGING_URL="$PIPPIP_STAGING_URL" \
            --dart-define=PIPPIP_STAGING_PUBLISHABLE_KEY="$PIPPIP_STAGING_PUBLISHABLE_KEY" \
            --dart-define=PIPPIP_PHONE_PILOT=true
      - name: Record compact phone QA digest
        shell: bash
        run: |
          out="apps/${{ matrix.app }}/build/app/outputs/flutter-apk"
          test -s "$out/app-release.apk"
          (cd "$out" && sha256sum app-release.apk > ARM64_QA_SHA256SUMS.txt)
          ls -lh "$out/app-release.apk"
          cat "$out/ARM64_QA_SHA256SUMS.txt"
      - name: Publish compact ARM64 QA test APK
        uses: actions/upload-artifact@v4
        with:
          name: pip-pip-${{ matrix.app }}-phone-qa-arm64
          path: |
            apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
            apps/${{ matrix.app }}/build/app/outputs/flutter-apk/ARM64_QA_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 5
